name: Bug report
description: Report a reproducible problem with the source-alpha project.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please do not include private media, secrets, or local absolute paths."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest safe reproduction and command used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Node, Python, and app versions as applicable.
    validations:
      required: true
